name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get module version
        id: version
        run: |
          version=$(jq -r '.version' module.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: changed
        run: |
          old_version=$(git show HEAD~1:module.json | jq -r '.version')
          if [ "$old_version" = "${{ steps.version.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package module
        if: steps.changed.outputs.changed == 'true'
        run: zip -r deathknell.zip module.json src lang assets

      - name: Create release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "$tag" deathknell.zip module.json \
            --title "$tag" \
            --generate-notes
